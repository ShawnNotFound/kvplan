[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kvplan"
dynamic = ["version"]
description = "Plan vLLM deployments without the GPU: will it start, how much KV cache, how many users."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shawn (Shuaijie Shao)" }]
keywords = ["vllm", "llm", "gpu", "memory", "kv-cache", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kvplan = "kvplan.cli:main"

[project.urls]
Homepage = "https://github.com/ShawnNotFound/kvplan"
Repository = "https://github.com/ShawnNotFound/kvplan"
Issues = "https://github.com/ShawnNotFound/kvplan/issues"
Changelog = "https://github.com/ShawnNotFound/kvplan/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/kvplan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kvplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs access to huggingface.co (deselect with -m 'not network')"]
